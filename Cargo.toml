[workspace]
resolver = "2"

members = [
    "crates/kerneltrace-common",
    "crates/kerneltrace-ebpf",
    "crates/kerneltrace-agent",
    "crates/kerneltrace-cli",
]

exclude = [
    "fuzz",
    "examples/basic_monitoring",
    "examples/custom_sink",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
authors = ["Gabryx412-coder"]
license = "Apache-2.0"
repository = "https://github.com/Gabryx412-coder/KernelTrace"
homepage = "https://github.com/Gabryx412-coder/KernelTrace"
documentation = "https://github.com/Gabryx412-coder/KernelTrace/tree/main/docs"
readme = "README.md"
keywords = ["ebpf", "hids", "security", "monitoring", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]

# ---------------------------------------------------------------------------
# Dipendenze condivise fra i crate del workspace.
# ---------------------------------------------------------------------------
[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

aya = "0.13"
aya-log = "0.2"
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

clap = { version = "4.5", features = ["derive", "env"] }

thiserror = "1.0"
anyhow = "1.0"

bytes = "1.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.9", features = ["v4", "serde"] }
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"
nix = { version = "0.29", features = ["process", "user", "fs", "signal"] }

sha2 = "0.10"
blake3 = "1.5"

criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.bench]
inherits = "release"
debug = true
strip = false