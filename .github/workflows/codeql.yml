name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 3"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["rust", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Per Rust, CodeQL richiede una build reale per l'analisi tracing
      # dei tipi; escludiamo il crate eBPF (no_std, target BPF non
      # supportato dall'autobuild di CodeQL) e ci limitiamo al resto del
      # workspace, comunque sufficiente per coprire tutta la logica di
      # detection, parsing e pipeline che elabora input non fidato.
      - name: Build Rust workspace for analysis
        if: matrix.language == 'rust'
        run: cargo build --workspace --exclude kerneltrace-ebpf

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"