name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build release binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install nightly toolchain for eBPF build
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: bpfel-unknown-none

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build eBPF programs
        run: |
          cd crates/kerneltrace-ebpf
          cargo +nightly build -Z build-std=core --release --target bpfel-unknown-none

      - name: Build agent and CLI binaries
        run: cargo build --release --target ${{ matrix.target }} -p kerneltrace-agent -p kerneltrace-cli

      - name: Package release archive
        run: |
          mkdir -p dist
          tar -czf dist/kerneltrace-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release \
            kerneltrace-agent kerneltrace-cli

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerneltrace-${{ matrix.target }}
          path: dist/kerneltrace-${{ matrix.target }}.tar.gz

  publish-release:
    name: Publish GitHub release
    needs: build-release-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Estrae la sezione del CHANGELOG.md corrispondente alla
          # versione taggata, così che la release GitHub riporti solo le
          # note pertinenti anziché l'intera cronologia del changelog.
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/**/*.tar.gz
          generate_release_notes: true