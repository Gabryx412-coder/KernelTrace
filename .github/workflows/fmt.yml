name: Format check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: rustfmt check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  ruff-format:
    name: ruff format check (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4,<1.0"

      - name: Check formatting
        run: |
          cd management
          ruff format --check .