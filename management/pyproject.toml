[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerneltrace-mgmt"
version = "0.1.0"
description = "Management CLI and utilities for the KernelTrace HIDS agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "KernelTrace Contributors" },
]
keywords = ["ebpf", "hids", "security", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1,<9.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "mypy>=1.8,<2.0",
    "ruff>=0.4,<1.0",
    "types-PyYAML",
]

[project.scripts]
kerneltrace-mgmt = "kerneltrace_mgmt.cli:main"

[tool.setuptools.packages.find]
include = ["kerneltrace_mgmt*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true