[package]
name = "kerneltrace-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "KernelTrace userspace agent: eBPF loader, event pipeline, detection engine, and output sinks"
readme = "README.md"

[lib]
name = "kerneltrace_agent"
path = "src/lib.rs"

[[bin]]
name = "kerneltrace-agent"
path = "src/main.rs"

[dependencies]
kerneltrace-common = { path = "../kerneltrace-common", features = ["std"] }

aya = { workspace = true }
aya-log = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
nix = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "pipeline_bench"
harness = false
path = "../../benches/pipeline_bench.rs"

[[bench]]
name = "detection_bench"
harness = false
path = "../../benches/detection_bench.rs"

[[test]]
name = "test_process_monitor"
path = "../../tests/integration/test_process_monitor.rs"

[[test]]
name = "test_fim"
path = "../../tests/integration/test_fim.rs"

[[test]]
name = "test_network_monitor"
path = "../../tests/integration/test_network_monitor.rs"

[[test]]
name = "test_rules_engine"
path = "../../tests/integration/test_rules_engine.rs"

[[test]]
name = "test_container_detection"
path = "../../tests/integration/test_container_detection.rs"